# Keeps the OBS packages in step with upstream releases.
#
# For every package folder (a folder with a _service file):
#   1. Look up the latest GitHub release of the upstream repo named in _service.
#   2. If it is newer than the <revision> in _service, bump it and commit to this repo.
#   3. Upload any file that differs from OBS and commit it there, which makes OBS fetch
#      the new source, vendor the crates, build and publish to the zypper repo.
#
# Needs (Settings > Secrets and variables > Actions):
#   secret   OBS_USER       your build.opensuse.org username
#   secret   OBS_PASSWORD   your build.opensuse.org password
#   variable OBS_PROJECT    e.g. home:xanaddams:craft (defaults to home:<OBS_USER>:craft)
name: OBS sync

on:
  schedule:
    - cron: "17 7 * * *"  # daily, 07:17 UTC
  push:
    branches: [main]
    paths: ["*/**", "!README.md", "!.github/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: obs-sync
  cancel-in-progress: false

env:
  OBS_API: https://api.opensuse.org

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump revisions to the latest upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed=""
          for svc in */_service; do
            pkg=$(dirname "$svc")
            url=$(sed -n 's|.*<param name="url">https://github.com/\([^<]*\)\.git</param>.*|\1|p' "$svc")
            current=$(sed -n 's|.*<param name="revision">\([^<]*\)</param>.*|\1|p' "$svc")
            latest=$(gh api "repos/$url/releases/latest" --jq .tag_name)
            echo "$pkg: upstream $url, packaged $current, latest $latest"
            if [ -n "$latest" ] && [ "$latest" != "$current" ]; then
              sed -i "s|<param name=\"revision\">$current</param>|<param name=\"revision\">$latest</param>|" "$svc"
              changed="$changed $pkg:$latest"
            fi
          done
          if [ -n "$changed" ]; then
            git config user.name "obs-sync bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update to upstream:$changed"
            git push
          fi

      - name: Upload changed files to OBS
        env:
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
          OBS_PROJECT: ${{ vars.OBS_PROJECT }}
        run: |
          set -euo pipefail
          : "${OBS_USER:?set the OBS_USER secret}" "${OBS_PASSWORD:?set the OBS_PASSWORD secret}"
          PRJ="${OBS_PROJECT:-home:$OBS_USER:craft}"
          auth=(-u "$OBS_USER:$OBS_PASSWORD" -fsS)
          msg=$(git log -1 --format=%s)
          for svc in */_service; do
            pkg=$(dirname "$svc")
            dirty=0
            for f in "$pkg"/*; do
              name=$(basename "$f")
              if curl "${auth[@]}" "$OBS_API/source/$PRJ/$pkg/$name" -o remote 2>/dev/null && cmp -s remote "$f"; then
                continue
              fi
              echo "$pkg: uploading $name"
              curl "${auth[@]}" -X PUT -T "$f" "$OBS_API/source/$PRJ/$pkg/$name?rev=upload" >/dev/null
              dirty=1
            done
            if [ "$dirty" = 1 ]; then
              curl "${auth[@]}" -X POST -G "$OBS_API/source/$PRJ/$pkg" --data-urlencode "cmd=commit" \
                --data-urlencode "comment=$msg" >/dev/null
              echo "$pkg: committed to $PRJ"
            else
              echo "$pkg: OBS already up to date"
            fi
          done
          rm -f remote
