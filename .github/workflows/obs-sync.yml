# Keeps the OBS packages in step with upstream releases.
#
# For every package folder (a folder with an upstream.conf):
#   1. Look up the latest GitHub release of the upstream repo (REPO=owner/name).
#   2. If it differs from TAG, bump TAG and the spec's Version:, and commit to this repo.
#   3. .github/obs-sync.py builds the source + vendored-crates tarballs for that tag,
#      uploads them with the spec and patches, and commits to OBS, which then builds
#      and publishes the zypper repo.
#
# Needs (Settings > Secrets and variables > Actions):
#   secret   OBS_USER       your build.opensuse.org username
#   secret   OBS_PASSWORD   your build.opensuse.org password
#   variable OBS_PROJECT    optional, defaults to home:<OBS_USER>:craft
name: OBS sync

on:
  schedule:
    - cron: "17 7 * * *"  # daily, 07:17 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: obs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Bump to the latest upstream releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed=""
          for conf in */upstream.conf; do
            pkg=$(dirname "$conf")
            repo=$(sed -n 's/^REPO=//p' "$conf")
            current=$(sed -n 's/^TAG=//p' "$conf")
            latest=$(gh api "repos/$repo/releases/latest" --jq .tag_name)
            echo "$pkg: upstream $repo, packaged $current, latest $latest"
            if [ -n "$latest" ] && [ "$latest" != "$current" ]; then
              sed -i "s/^TAG=.*/TAG=$latest/" "$conf"
              sed -i -E "s/^(Version:[[:space:]]+).*/\1${latest#v}/" "$pkg"/*.spec
              changed="$changed $pkg:$latest"
            fi
          done
          if [ -n "$changed" ]; then
            git config user.name "obs-sync bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update to upstream:$changed"
            git push
          fi

      - name: Upload to OBS
        env:
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
          OBS_PROJECT: ${{ vars.OBS_PROJECT }}
        run: python3 .github/obs-sync.py
